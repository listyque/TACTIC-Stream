ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 130
    # The public HTTP endpoint owns these headers; clients cannot impersonate a proxy.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "http"
    <Proxy balancer://tactic-stream>
        BalancerMember http://app:8081 connectiontimeout=5 timeout=130 retry=1
        BalancerMember http://app:8082 connectiontimeout=5 timeout=130 retry=1
        BalancerMember http://app:8083 connectiontimeout=5 timeout=130 retry=1
        ProxySet lbmethod=byrequests
    </Proxy>
    ProxyPass / balancer://tactic-stream/
    ProxyPassReverse / balancer://tactic-stream/
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
